  name: Choice
  nameWithType: PseudostateKind.Choice
  fullName: NMF.Interop.Uml.PseudostateKind.Choice
  type: Field
  source:
    remote:
      path: Interop/UMLInterop/Uml/PseudostateKind.cs
      branch: main
      repo: https://github.com/NMFCode/NMF.git
    id: Choice
    path: src/Interop/UMLInterop/Uml/PseudostateKind.cs
    startLine: 79
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: Choice vertices which, when reached, result in the dynamic evaluation of the guards of the triggers of its outgoing transitions. This realizes a dynamic conditional branch. It allows splitting of transitions into multiple outgoing paths such that the decision on which path to take may be a function of the results of prior actions performed in the same run-tocompletion step. If more than one of the guards evaluates to true, an arbitrary one is selected. If none of the guards evaluates to true, then the model is considered ill-formed. (To avoid this, it is recommended to define one outgoing transition with the predefined else guard for every choice vertex.) Choice vertices should be distinguished from static branch points that are based on junction points (described above).
  example: []
  syntax:
    content: Choice = 6
    return:
      type: NMF.Interop.Uml.PseudostateKind
