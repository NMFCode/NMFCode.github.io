  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Cmof
  summary: A slot giving the value or values of a structural feature of the instance. An instance specification can have one slot per structural feature of its classifiers, including inherited features. It is not necessary to model a slot for each structural feature, in which case the instance specification is a partial description.
  example: []
  syntax:
    content: >-
      [Browsable(false)]

      [XmlElementName("slot")]

