    startLine: 54
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: DeepHistory represents the most recent active configuration of the composite state that directly contains this pseudostate; e.g. the state configuration that was active when the composite state was last exited. A composite state can have at most one deep history vertex. At most one transition may originate from the history connector to the default deep history state. This transition is taken in case the composite state had never been active before. Entry actions of states entered on the path to the state represented by a deep history are performed.
  example: []
  syntax:
    content: DeepHistory = 1
    return:
      type: NMF.Interop.Uml.PseudostateKind
