    path: src/Interop/UMLInterop/Uml/InteractionOperatorKind.cs
    startLine: 99
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: The InteractionOperatorKind ignore designates that there are some message types that are not shown within this combined fragment. These message types can be considered insignificant and are implicitly ignored if they appear in a corresponding execution. Alternatively, one can understand ignore to mean that the message types that are ignored can appear anywhere in the traces.
  example: []
  syntax:
    content: Ignore = 10
    return:
      type: NMF.Interop.Uml.InteractionOperatorKind
