  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: The InteractionOperatorKind opt designates that the CombinedFragment represents a choice of behavior where either the (sole) operand happens or nothing happens. An option is semantically equivalent to an alternative CombinedFragment where there is one operand with non-empty content and the second operand is empty.
  example: []
  syntax:
    content: Opt = 2
    return:
      type: NMF.Interop.Uml.InteractionOperatorKind
- uid: NMF.Interop.Uml.InteractionOperatorKind.Break
  commentId: F:NMF.Interop.Uml.InteractionOperatorKind.Break
