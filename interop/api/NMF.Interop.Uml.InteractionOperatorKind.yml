  type: Field
  source:
    remote:
      path: Interop/UMLInterop/Uml/InteractionOperatorKind.cs
      branch: main
      repo: https://github.com/NMFCode/NMF.git
    id: Critical
    path: src/Interop/UMLInterop/Uml/InteractionOperatorKind.cs
    startLine: 84
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: The InteractionOperatorKind critical designates that the CombinedFragment represents a critical region. A critical region means that the traces of the region cannot be interleaved by other OccurrenceSpecifications (on those Lifelines covered by the region). This means that the region is treated atomically by the enclosing fragment when determining the set of valid traces. Even though enclosing CombinedFragments may imply that some OccurrenceSpecifications may interleave into the region, such as with par-operator, this is prevented by defining a region.
  example: []
  syntax:
    content: Critical = 7
    return:
      type: NMF.Interop.Uml.InteractionOperatorKind
