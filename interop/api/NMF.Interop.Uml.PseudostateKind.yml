  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: Entering a terminate pseudostate implies that the execution of this state machine by means of its context object is terminated. The state machine does not exit any states nor does it perform any exit actions other than those associated with the transition leading to the terminate pseudostate. Entering a terminate pseudostate is equivalent to invoking a DestroyObjectAction.
  example: []
  syntax:
    content: Terminate = 9
    return:
      type: NMF.Interop.Uml.PseudostateKind
