    startLine: 59
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: ShallowHistory represents the most recent active substate of its containing state (but not the substates of that substate). A composite state can have at most one shallow history vertex. A transition coming into the shallow history vertex is equivalent to a transition coming into the most recent active substate of a state. At most one transition may originate from the history connector to the default shallow history state. This transition is taken in case the composite state had never been active before. Entry actions of states entered on the path to the state represented by a shallow history are performed.
  example: []
  syntax:
    content: ShallowHistory = 2
    return:
      type: NMF.Interop.Uml.PseudostateKind
