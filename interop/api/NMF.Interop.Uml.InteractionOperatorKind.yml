    path: src/Interop/UMLInterop/Uml/InteractionOperatorKind.cs
    startLine: 54
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: The InteractionOperatorKind alt designates that the CombinedFragment represents a choice of behavior. At most one of the operands will be chosen. The chosen operand must have an explicit or implicit guard expression that evaluates to true at this point in the interaction. An implicit true guard is implied if the operand has no guard.
  example: []
  syntax:
    content: Alt = 1
    return:
      type: NMF.Interop.Uml.InteractionOperatorKind
