  syntax:
    content: IEdgeLabelSyntax<T> At(double pos, EdgeSide side = EdgeSide.On, bool rotate = false, double? offset = null)
    parameters:
    - id: pos
      type: System.Double
      description: The relative position of the label, from 0 (source anchor) to 1 (target anchor)
    - id: side
      type: NMF.Glsp.Language.EdgeSide
      description: Denotes on which side the label is placed
    - id: rotate
      type: System.Boolean
      description: True, if the label should be rotated, otherwise false
    - id: offset
      type: System.Nullable{System.Double}
      description: An offset to the next node or edge
