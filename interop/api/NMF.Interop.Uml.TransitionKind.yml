  namespace: NMF.Interop.Uml
  summary: Implies that the Transition, if triggered, will not exit the composite (source) State, but it will exit and re-enter any state within the composite State that is in the current state configuration.
  example: []
  syntax:
    content: Local = 1
    return:
      type: NMF.Interop.Uml.TransitionKind
