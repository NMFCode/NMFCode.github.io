    id: IsLeaf
    path: src/Interop/UMLInterop/Cmof/RedefinableElement.cs
    startLine: 69
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Cmof
  summary: 'Indicates whether it is possible to further redefine a RedefinableElement. If the value is true, then it is not possible to further redefine the RedefinableElement. Note that this property is preserved through package merge operations; that is, the capability to redefine a RedefinableElement (i.e., isLeaf=false) must be preserved in the resulting RedefinableElement of a package merge operation where a RedefinableElement with isLeaf=false is merged with a matching RedefinableElement with isLeaf=true: the resulting RedefinableElement will have isLeaf=false. Default value is false.'
  example: []
  syntax:
    content: >-
      [TypeConverter(typeof(LowercaseBooleanConverter))]

      [XmlElementName("isLeaf")]

      [XmlAttribute(true)]

      public bool IsLeaf { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: >-
      <TypeConverter(GetType(LowercaseBooleanConverter))>

      <XmlElementName("isLeaf")>

      <XmlAttribute(True)>

      Public Property IsLeaf As Boolean
  overload: NMF.Interop.Cmof.RedefinableElement.IsLeaf*
  implements:
