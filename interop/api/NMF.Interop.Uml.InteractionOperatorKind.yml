  source:
    remote:
      path: Interop/UMLInterop/Uml/InteractionOperatorKind.cs
      branch: main
      repo: https://github.com/NMFCode/NMF.git
    id: Break
    path: src/Interop/UMLInterop/Uml/InteractionOperatorKind.cs
    startLine: 64
  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: The InteractionOperatorKind break designates that the CombinedFragment represents a breaking scenario in the sense that the operand is a scenario that is performed instead of the remainder of the enclosing InteractionFragment. A break operator with a guard is chosen when the guard is true and the rest of the enclosing Interaction Fragment is ignored. When the guard of the break operand is false, the break operand is ignored and the rest of the enclosing InteractionFragment is chosen. The choice between a break operand without a guard and the rest of the enclosing InteractionFragment is done non-deterministically.
  example: []
  syntax:
    content: Break = 3
    return:
      type: NMF.Interop.Uml.InteractionOperatorKind
