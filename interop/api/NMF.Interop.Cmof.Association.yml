  namespace: NMF.Interop.Cmof
  summary: " When an association specializes another association, every end of the specific association corresponds to an end of the general association, and the specific end reaches the same type or a subtype of the more general end.\r\nSequence{1..self.memberEnd-&gt;size()}-&gt;\r\n	forAll(i | self.general-&gt;select(oclIsKindOf(Association)).oclAsType(Association)-&gt;\r\n		forAll(ga |self.memberEnd-&gt;at(i).type.conformsTo(ga.memberEnd-&gt;at(i).type)))"
