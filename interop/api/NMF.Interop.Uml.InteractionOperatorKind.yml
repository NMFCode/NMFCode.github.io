  summary: " InteractionOperatorKind is an enumeration designating the different kinds of operators of CombinedFragments. The InteractionOperand defines the type of operator of a CombinedFragment.\r\n&lt;p&gt;From package UML::Interactions.&lt;/p&gt;"
