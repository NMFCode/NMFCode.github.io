  assemblies:
  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: No concurrency management mechanism is associated with the BehavioralFeature and, therefore, concurrency conflicts may occur. Instances that invoke a BehavioralFeature need to coordinate so that only one invocation to a target on any BehavioralFeature occurs at once.
  example: []
  syntax:
    content: Sequential = 0
    return:
      type: NMF.Interop.Uml.CallConcurrencyKind
