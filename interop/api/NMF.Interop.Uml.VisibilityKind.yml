  - NMF.UMLInterop
  namespace: NMF.Interop.Uml
  summary: A NamedElement with package visibility is visible to all Elements within the nearest enclosing Package (given that other owning Elements have proper visibility). Outside the nearest enclosing Package, a NamedElement marked as having package visibility is not visible.  Only NamedElements that are not owned by Packages can be marked as having package visibility.
  example: []
  syntax:
    content: Package = 3
    return:
      type: NMF.Interop.Uml.VisibilityKind
